# Netlify configuration.
# There is no build step — the repository root IS the deployable site.
# Security and cache headers live in `_headers` so that the same file also
# works unchanged on Cloudflare Pages.

[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = true

# Serve /about instead of /about/ consistently and drop any .html suffix.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Canonical host is the apex, shivprinterhouse.com — matching the canonical
# URLs in the HTML, sitemap.xml and robots.txt. Redirect www to it.
# Only needed if you deploy to Netlify; on Cloudflare Pages add both domains to
# the project and set the www -> apex redirect there instead.
# [[redirects]]
#   from = "https://www.shivprinterhouse.com/*"
#   to = "https://shivprinterhouse.com/:splat"
#   status = 301
#   force = true
